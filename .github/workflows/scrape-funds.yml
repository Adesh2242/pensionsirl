name: Scrape fund data

on:
  schedule:
    # 06:00 UTC every Monday. The source site updates infrequently, and
    # scrape_log.finished_at (shown in the app as "Fund data last updated")
    # tracks the actual run time regardless of schedule.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # pnpm comes from corepack, which ships with Node and installs the exact
      # version pinned in package.json's packageManager field. That keeps
      # every action in this job GitHub's own: no third-party code runs
      # alongside the Supabase service-role key, and repos that only allow
      # GitHub-authored actions can still run it. (setup-node's pnpm cache is
      # dropped because it needs pnpm on PATH before corepack can provide it;
      # a weekly job doesn't need it.)
      - run: corepack enable
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

      - run: pnpm install --frozen-lockfile

      - run: pnpm scrape:funds
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
